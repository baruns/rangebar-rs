[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rangebar-rs"
version = "0.1.7"
description = "High-performance Rust implementation of Range Bars for financial data analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["polars>=1.0"]
license = {text = "MIT"}
authors = [
    {name = "BARUN SINGH", email = "barun@nglogix.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["rangebar", "range-bars", "financial", "trading", "technical-analysis", "rust", "polars"]

[project.urls]
Homepage = "https://github.com/baruns/rangebar-rs"
Repository = "https://github.com/baruns/rangebar-rs"
Issues = "https://github.com/baruns/rangebar-rs/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
